[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpulse-ai"
version = "1.0.0"
description = "Local-first privacy-preserving people flow and occupancy analytics"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "numpy>=2.1,<3", "opencv-python>=4.10,!=4.13.0.90,<5", "shapely>=2.0,<3", "websockets>=13,<17"
]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]
vision = ["ultralytics>=8.3,<9"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/"]
